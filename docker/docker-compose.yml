# Vault Finance — self-hosted stack.
#   cp .env.example .env   (edit if you like)
#   docker compose up -d
# Everything stays on this machine. See docs/self-hosting.md.
#
# All persistent data lives under a single directory, VAULT_DISK (default
# ./data, i.e. docker/data). To keep everything on a dedicated drive, mount it
# and set VAULT_DISK=/mnt/your-drive/vault before `docker compose up`.

name: vault-finance

# Container logs rotate at 10 MB, keeping 3 files per service, so old logs are
# deleted instead of piling up forever. They never contain secrets (see the
# logger's redaction list in apps/server/src/app.ts).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env - installers/server/install-server.sh generates one}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - ${VAULT_DISK:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    # Optional: the server runs fine without Redis (in-memory fallbacks).
    # Remove this service if you want the smallest possible stack.
    volumes:
      - ${VAULT_DISK:-./data}/redis:/data

  server:
    logging: *logging
    # Default: pull a prebuilt release image so `docker compose pull && up -d`
    # (i.e. `vault-update`) upgrades without a local build. To build from source
    # instead, comment out `image:` and uncomment the `build:` block.
    image: ghcr.io/nomad9021/vault-finance-server:${VAULT_VERSION:-latest}
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Lets the server reach an AI server running directly on this machine
    # (outside Docker) at http://host.docker.internal:<port>. Machines elsewhere
    # on your LAN or Tailscale are reachable by their own address as usual.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env - installers/server/install-server.sh generates one}@postgres:5432/${POSTGRES_DB:-vault}
      VAULT_PORT: "8443"
      # TLS: a self-signed cert is generated into the data volume on first
      # boot (stable across restarts — clients pin its fingerprint). To use
      # your own cert, mount it and set VAULT_TLS_CERT / VAULT_TLS_KEY.
      VAULT_TLS: "on"
      # Point at the bundled Ollama by default; change OLLAMA_HOST/PORT to use
      # an Ollama elsewhere on your network (never hardcoded to localhost).
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      # Optional: let the assistant start a separate AI server's Proxmox VM.
      AI_HOST_PROXMOX_URL: ${AI_HOST_PROXMOX_URL:-}
      AI_HOST_PROXMOX_NODE: ${AI_HOST_PROXMOX_NODE:-}
      AI_HOST_VMID: ${AI_HOST_VMID:-}
      AI_HOST_PROXMOX_TOKEN: ${AI_HOST_PROXMOX_TOKEN:-}
      AI_HOST_PROXMOX_FINGERPRINT: ${AI_HOST_PROXMOX_FINGERPRINT:-}
      # Auto-sync linked banks every N minutes (0 disables). Keeps transactions
      # updating on their own for a self-hosted server that isn't internet-
      # reachable; Plaid webhooks give instant updates when it is.
      BANK_AUTO_SYNC_MINUTES: ${BANK_AUTO_SYNC_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Outbound email + update checks (all optional — see .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SURVEY_URL: ${SURVEY_URL:-}
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
      UPDATE_OPERATOR_MANAGED: ${UPDATE_OPERATOR_MANAGED:-false}
    volumes:
      - ${VAULT_DISK:-./data}/vault:/data
    ports:
      - "${VAULT_PORT:-8443}:8443"

  ollama:
    logging: *logging
    image: ollama/ollama:latest
    restart: unless-stopped
    # Local AI runtime. Optional: comment this service out (or set
    # OLLAMA_HOST to another machine) and every non-AI feature keeps working.
    volumes:
      - ${VAULT_DISK:-./data}/ollama:/root/.ollama
    # Uncomment to expose Ollama to other machines on your network:
    # ports:
    #   - "11434:11434"
    # For NVIDIA GPU acceleration, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

