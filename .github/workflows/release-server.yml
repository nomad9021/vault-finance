# Release: a tag push (v*) builds the server image and publishes it to the
# GitHub Container Registry so every self-hosted server can update by pulling a
# prebuilt image instead of rebuilding from source. See docs/releasing.md.
name: release-server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/vault-finance-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          else
            version="${REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.]*|"") echo "invalid version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.control
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vault-finance-control:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vault-finance-control:latest
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control

      - name: Summary
        run: |
          echo "Published \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.v.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Servers update with: \`vault-update\` (or \`familyctl.sh update --all\`)." >> "$GITHUB_STEP_SUMMARY"
