# Release: a tag push (v*) builds the server image and publishes it to the
# GitHub Container Registry so every self-hosted server can update by pulling a
# prebuilt image instead of rebuilding from source. See docs/releasing.md.
name: release-server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
      latest:
        description: "Also move the :latest tag (servers on the default VAULT_VERSION update to it)"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/vault-finance-server
  CONTROL_IMAGE: ${{ github.repository_owner }}/vault-finance-control

jobs:
  # Each platform builds on its own native runner (GitHub's free arm64 runners
  # for public repos) instead of arm64 under QEMU, which hung mid-build on
  # v0.1.7 and v0.1.10. Each pushes a per-arch tag; `publish` then combines
  # them into the multi-arch :<version> (and :latest) tags.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          else
            version="${REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.]*|"") echo "invalid version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Annotated tag message containing [prerelease] → publish the
          # versioned image only, leaving :latest on the previous release.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$INPUT_LATEST" = "true" ] && pre=false || pre=true
          else
            git fetch --force --depth=1 origin "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
            if git tag -l --format='%(contents)' "$REF_NAME" | grep -qF '[prerelease]'; then pre=true; else pre=false; fi
          fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.v.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Build and push control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.control
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.CONTROL_IMAGE }}:${{ steps.v.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=control-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=control-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the per-arch images
        run: |
          for image in "$IMAGE" "$CONTROL_IMAGE"; do
            ref="$REGISTRY/$image"
            tags=(-t "$ref:$VERSION")
            [ "$PRERELEASE" = "true" ] || tags+=(-t "$ref:latest")
            docker buildx imagetools create "${tags[@]}" "$ref:$VERSION-amd64" "$ref:$VERSION-arm64"
          done

      - name: Summary
        run: |
          echo "Published \`$REGISTRY/$IMAGE:$VERSION\` (amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PRERELEASE" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pre-release: \`:latest\` was NOT moved. To run it, set VAULT_VERSION=$VERSION in docker/.env." >> "$GITHUB_STEP_SUMMARY"
          fi
