# Release: a tag push (v*) builds the server image and publishes it to the
# GitHub Container Registry so every self-hosted server can update by pulling a
# prebuilt image instead of rebuilding from source. See docs/releasing.md.
name: release-server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
      latest:
        description: "Also move the :latest tag (servers on the default VAULT_VERSION update to it)"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/vault-finance-server

jobs:
  image:
    runs-on: ubuntu-latest
    # Normally ~10 min. QEMU can crash mid-step for arm64 and hang instead of
    # failing (seen on v0.1.7); fail fast so a re-run can be started.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          else
            version="${REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.]*|"") echo "invalid version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Annotated tag message containing [prerelease] → publish the
          # versioned image only, leaving :latest on the previous release.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$INPUT_LATEST" = "true" ] && pre=false || pre=true
          else
            git fetch --force --depth=1 origin "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
            if git tag -l --format='%(contents)' "$REF_NAME" | grep -qF '[prerelease]'; then pre=true; else pre=false; fi
          fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ steps.channel.outputs.prerelease != 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE) || '' }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.control
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vault-finance-control:${{ steps.v.outputs.version }}
            ${{ steps.channel.outputs.prerelease != 'true' && format('{0}/{1}/vault-finance-control:latest', env.REGISTRY, github.repository_owner) || '' }}
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control

      - name: Summary
        run: |
          echo "Published \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.v.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.channel.outputs.prerelease }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pre-release: \`:latest\` was NOT moved. To run it, set VAULT_VERSION=${{ steps.v.outputs.version }} in docker/.env." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Servers update with: \`vault-update\` (or \`familyctl.sh update --all\`)." >> "$GITHUB_STEP_SUMMARY"
