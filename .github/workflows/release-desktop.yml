# Release: a tag push (v*) builds installers for all three platforms and
# publishes a draft GitHub release with updater artifacts + latest.json.
# The macOS job runs entirely on GitHub's macos runner — no local Mac ever
# (spec constraint). Signing/notarization secrets are optional: without them
# the build still succeeds and ships unsigned (see docs/releasing.md for the
# exact secrets to add and the one-time Apple/browser steps).
name: release-desktop

on:
  push:
    tags: ["v*"]

jobs:
  # One draft release, made before any build starts. The four builds used to
  # each look for a draft and create one if none existed; starting together,
  # two of them did (v0.2.0), and the installers were split across two
  # releases. Now every build uploads to this one by id.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Release channel
        id: channel
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force --depth=1 origin "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
          if git tag -l --format='%(contents)' "$REF_NAME" | grep -qF '[prerelease]'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the draft release (or reuse it on a re-run)
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "map(select(.tag_name == \"$REF_NAME\")) | .[0].id // empty")
          if [ -z "$id" ]; then
            body="Self-hosted personal finance. Install the app for your platform, point it at your server, done. See the self-hosting guide for server setup."
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$REF_NAME" -f name="Vault Finance $REF_NAME" -f body="$body" \
              -F draft=true -F prerelease="$PRERELEASE" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # oldest LTS runner = widest glibc compatibility
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest # arm64 (Apple Silicon)
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Tauri Linux prerequisites
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac architectures build from the same runner.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vault/shared --filter @vault/design-tokens --filter @vault/ui build

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (required for auto-update to work):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization. Leave these commented until you
          # actually have an Apple Developer certificate: Tauri's macOS bundler
          # treats a *present-but-empty* APPLE_CERTIFICATE as "sign me" and then
          # fails ("failed to import keychain certificate"). With them absent the
          # bundle is ad-hoc signed via bundle.macOS.signingIdentity "-" in
          # tauri.conf.json — without that, macOS calls the downloaded app
          # "damaged" and only offers Move to Trash. That ships an un-notarized
          # .dmg (Gatekeeper blocks first
          # launch until approved: Open Anyway in System Settings on macOS 15+,
          # right-click → Open on earlier versions). Uncomment all six once the
          # secrets exist — see docs/releasing.md.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (optional — set both to enable):
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          # Upload into the one draft made by create-release (a human clicks
          # Publish after spot-checking). Draft-ness and the pre-release flag
          # (a pre-release is never "latest", so the updater's latest.json
          # keeps pointing at the previous version) are set there.
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
