[package]
name = "vault-ui"
description = "Vault Finance pages in Leptos, mounted inside the React shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vault-core = { path = "../vault-core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Storage",
  "Window",
] }
serde.workspace = true
serde-wasm-bindgen = "0.6"
send_wrapper = "0.6"
console_error_panic_hook = "0.1"
